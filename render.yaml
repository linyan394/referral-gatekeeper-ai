services:
  - type: web
    name: referral-gatekeeper-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: GATEKEEPER_PORT
        value: 8080
    healthCheckPath: /api/v1/health