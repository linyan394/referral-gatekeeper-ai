<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>engine test</title></head>
<body><pre id="out">RUNNING</pre>
<script src="knowledge.js"></script>
<script src="engine.js"></script>
<script>
const cases = [
  {name:"急诊胸痛", p:{age:65, gender:"male", complaint:"持续胸痛2小时，伴大汗、气短", history:"高血压10年，冠心病", vitalsText:"血压 90/60，心率 130", targetHospital:"北京协和医院"}},
  {name:"儿童发热", p:{age:5, gender:"male", complaint:"小儿发热咳嗽3天", history:"", vitalsText:"体温 39.2", targetHospital:"县人民医院"}},
  {name:"普通感冒", p:{age:30, gender:"female", complaint:"鼻塞流涕两天", history:"", vitalsText:"", targetHospital:"省人民医院"}}
];
const results = [];
for (const c of cases) {
  const a = analyze(c.p);
  const d = evaluateDecision(a);
  const h = findHospital(c.p.targetHospital);
  const recs = recommend(c.p, a, h ? h.departments : []);
  const hc = validateTargetHospital(c.p.targetHospital, recs);
  const pc = getPreReferralChecks(a);
  results.push({case:c.name, emergency:a.hasEmergency, symptoms:a.symptoms.slice(0,6), vitals:a.abnormalVitals,
    decision:{shouldRefer:d.shouldRefer, urgency:d.urgency}, top:recs.slice(0,3).map(r=>({d:r.department,s:r.score,c:r.confidence,av:r.available})),
    hospitalFound:hc.found, preChecks:pc.map(x=>x.item)});
}
document.getElementById("out").textContent = JSON.stringify(results, null, 1);
</script>
</body></html>
